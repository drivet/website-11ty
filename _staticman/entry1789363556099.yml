message: "Бот «Раздеватор» может снимать одежду особ с помощью изображений. \r\nЭтот сервис эксплуатирует сложные методы для обработки изображений. \r\n<a href=\"https://razdevator.tech/\">раздеватор по фото</a> \r\nБот способен генерировать убедительные результаты по предоставленного файла. \r\nНо следует учитывать, что данный инструмент нарушает конфиденциальность персон и не рекомендуется к применению."
