message: "Лейбл Rick Owens воспринимается как экспериментальный лейбл, запущенный в 94-м с нонконформистской установкой и особым стилем в духе готики и гранжа. \r\nСам Оуэнс приобрёл известность объёмными драпировками, нестандартными пропорциями и выбором плотной кожи вместе с минималистичным кроем и тёмными цветами. \r\n<a href=\"https://rick-owens-moscow.ru/\">rick-owens-moscow.ru</a> \r\nБренд соединяет премиальность и нонконформизм, создавая вещи для людей выбирает самовыражение и готов выделяться эпатажно. \r\nСегодня эта марка — это больше чем мода, а целое мировоззрение, охватывающее мебель, обувь и философию личного бунтарства."
