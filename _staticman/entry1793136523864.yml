message: "Rick Owens является независимый дом моды, основанный в 94-м с антигламурной идеей и фирменным подходом на стыке тёмного гламура и рок-н-ролла. \r\nРик Оуэнс прославился скульптурными драпировками, экспериментальными силуэтами и применением текстурированных материалов в сочетании с минимализмом и глубокими тонами. \r\n<a href=\"https://rick-owens-moscow.ru/\">новинки Рик Овенс бутик</a> \r\nМарка соединяет роскошь и нонконформизм, предлагая одежду для людей предпочитает уникальность и при этом не боится выглядеть эпатажно. \r\nНа данный момент эта марка является не просто гардероб, но и целое эстетическое высказывание, включающее предметы интерьера, экстравагантную обувь и философию осознанного выбора."
