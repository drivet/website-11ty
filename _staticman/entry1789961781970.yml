message: "A proxy server is an kind of intermediary between your device and web servers. \r\nIf a client connects using this service, the data go through the server at first, and after that it forwards the requests toward the destination on your behalf. \r\n<a href=\"https://webvpn.org/anonymity/send-anonymous-email/\">Send an anonymous email</a> \r\nUsing a proxy helps to mask the user's IP address, bypass geoblocking, and improve security. \r\nHowever, some proxies can be unsafe, so you should select a trustworthy proxy provider."
