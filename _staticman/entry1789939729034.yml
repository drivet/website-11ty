message: "A proxy gateway functions as a type of intermediary connecting your device and online resources. \r\nIf a client connects through the proxy, your requests travel to the proxy first, and subsequently the service passes them to the destination for you. \r\n<a href=\"https://webvpn.org/privacy/\">privacy page</a> \r\nUsing a proxy can hide your IP address, overcome regional blocks, and improve anonymity. \r\nNevertheless, some proxies can be not secure, so it's important choose a reliable vendor."
