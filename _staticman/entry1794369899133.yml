message: "Дом Rick Owens — это независимый бренд, появившийся в 94-м с чёткой протестной идеей и узнаваемым почерком в духе тёмного гламура и рок-н-ролла. \r\nОснователь известен скульптурными драпировками, экспериментальными силуэтами и применением плотной кожи вместе с минималистичным кроем и глубокими тонами. \r\n<a href=\"https://rick-owens-moscow.ru/\">rick-owens-moscow.ru</a> \r\nБренд соединяет роскошь и протест, создавая вещи для людей ценит уникальность а также не боится выделяться провокационно. \r\nСегодня этот бренд представляет собой не просто гардероб, а узнаваемое мировоззрение, объединяющее мебель, обувь и идеологию осознанного выбора."
