message: "No notes!\r\nBut I will add to the twin sister angle Nolan adds here. At first, I didn't think it made sense since Helen is supposed to be such a singular beauty that launched an epic war. How can there be two?\r\nBut this is why I feel I need to see the movie again: I vaguely remembered there's a quick line about Helen just being an excuse to start a war to disrupt Troy's trade routes (shades of Phantom Menace :D ). Helen having a twin, and thus diluting her legendary beauty, gives a second point of data reinforcing this idea that she was never the catalyst for the war."
